apiVersion: 1
datasources:
  - name: AgentTrust Metrics
    uid: agenttrust-prometheus
    type: prometheus
    access: proxy
    url: http://stack-prometheus:9090
    isDefault: true
    editable: false
  - name: AgentTrust Traces
    uid: agenttrust-tempo
    type: tempo
    access: proxy
    url: http://stack-tempo:3200
    editable: false
  - name: AgentTrust Logs
    uid: agenttrust-loki
    type: loki
    access: proxy
    url: http://stack-loki:3100
    editable: false
