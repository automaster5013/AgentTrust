receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 1048576
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  filter/services:
    error_mode: propagate
    traces:
      span:
        - 'not IsMatch(resource.attributes["service.name"], "^agenttrust-(core-api|gateway|ai-worker|privacy-probe)$")'
        - 'Len(span.links) > 0'
      spanevent:
        - 'true'
    logs:
      log_record:
        - 'not IsMatch(resource.attributes["service.name"], "^agenttrust-(core-api|gateway|ai-worker|privacy-probe)$")'
    metrics:
      metric:
        - 'not IsMatch(resource.attributes["service.name"], "^agenttrust-(core-api|gateway|ai-worker|privacy-probe)$")'
        - 'not IsMatch(metric.name, "^(http\\.(server|client)\\.(request\\.duration|duration)|agenttrust\\.evaluations)$")'
      datapoint:
        - 'Len(datapoint.exemplars) > 0'
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - 'keep_keys(resource.attributes, ["service.name"])'
          - 'set(resource.schema_url, "")'
          - 'keep_keys(scope.attributes, [])'
          - 'set(scope.name, "agenttrust.instrumentation")'
          - 'set(scope.version, "")'
          - 'set(scope.schema_url, "")'
          - 'set(span.name, "agenttrust.operation")'
          - 'set(span.status.message, "")'
          - 'set(span.trace_state, "")'
          - 'keep_keys(span.attributes, ["http.request.method", "http.response.status_code"])'
          - 'delete_key(span.attributes, "http.request.method") where not IsMatch(span.attributes["http.request.method"], "^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)$")'
          - 'delete_key(span.attributes, "http.response.status_code") where not IsInt(span.attributes["http.response.status_code"])'
          - 'delete_key(span.attributes, "http.response.status_code") where IsInt(span.attributes["http.response.status_code"]) and (span.attributes["http.response.status_code"] < 100 or span.attributes["http.response.status_code"] > 599)'
    log_statements:
      - context: log
        statements:
          - 'keep_keys(resource.attributes, ["service.name"])'
          - 'set(resource.schema_url, "")'
          - 'keep_keys(scope.attributes, [])'
          - 'set(scope.name, "agenttrust.instrumentation")'
          - 'set(scope.version, "")'
          - 'set(scope.schema_url, "")'
          - 'keep_keys(log.attributes, [])'
          - 'set(log.body, "application event")'
          - 'set(log.severity_text, "")'
    metric_statements:
      - context: datapoint
        statements:
          - 'keep_keys(resource.attributes, ["service.name"])'
          - 'set(resource.schema_url, "")'
          - 'keep_keys(scope.attributes, [])'
          - 'set(scope.name, "agenttrust.instrumentation")'
          - 'set(scope.version, "")'
          - 'set(scope.schema_url, "")'
          - 'set(metric.description, "")'
          - 'set(metric.unit, "")'
          - 'keep_keys(datapoint.attributes, ["http.request.method", "http.response.status_code"])'
          - 'delete_key(datapoint.attributes, "http.request.method") where not IsMatch(datapoint.attributes["http.request.method"], "^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS)$")'
          - 'delete_key(datapoint.attributes, "http.response.status_code") where not IsInt(datapoint.attributes["http.response.status_code"])'
          - 'delete_key(datapoint.attributes, "http.response.status_code") where IsInt(datapoint.attributes["http.response.status_code"]) and (datapoint.attributes["http.response.status_code"] < 100 or datapoint.attributes["http.response.status_code"] > 599)'
      - context: metric
        statements:
          - 'aggregate_on_attributes("sum", ["http.request.method", "http.response.status_code"])'
  batch:
    timeout: 1s
    send_batch_size: 128
exporters:
  otlphttp/tempo:
    endpoint: http://stack-tempo:4318
    timeout: 2s
  otlphttp/loki:
    endpoint: http://stack-loki:3100/otlp
    timeout: 2s
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  telemetry:
    logs:
      level: error
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/services, transform/privacy, batch]
      exporters: [otlphttp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/services, transform/privacy, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/services, transform/privacy, batch]
      exporters: [prometheus]
