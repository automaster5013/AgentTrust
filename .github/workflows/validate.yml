name: Validate and deliver
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: agenttrust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: agenttrust-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --cache .cache/npm --ignore-scripts
      - run: npm run setup
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high --cache .cache/npm
      - name: Match API user to private signing-file owner
        run: echo "AGENTTRUST_API_USER=$(id -u):$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose up --build -d --wait api worker
      - name: Verify independent Docker evaluation and persisted evidence
        run: |
          node --env-file-if-exists=.env scripts/smoke.mjs before
          docker compose restart api worker
          docker compose up -d --wait api worker
          node --env-file-if-exists=.env scripts/smoke.mjs after
      - name: Verify signed CI gate and manual approval boundaries
        run: |
          node --env-file-if-exists=.env scripts/ci-smoke.mjs
          node --env-file-if-exists=.env scripts/manual-review-smoke.mjs
      - name: Verify reproducible synthetic portfolio scenario
        run: |
          npm run demo:preflight
          npm run demo:portfolio
          npm run demo:portfolio -- --compare
          npm run demo:roles
      - name: Verify bounded viewer metadata measurements
        run: |
          npm run benchmark:metadata -- --samples 5
          npm run benchmark:metadata -- --samples 5 --concurrency 4
      - name: Verify bounded parallel synthetic creation
        run: npm run smoke:burst -- --runs 6
      - name: Verify repeated synthetic outcomes and exactly-once accounting
        run: npm run smoke:sustained -- --cycles 2 --interval-ms 1000
      - name: Verify interrupted worker lease recovery
        run: node --env-file-if-exists=.env scripts/resilience-smoke.mjs
      - name: Verify backup authentication failure cleanup and isolated restoration
        run: npm run smoke:recovery
      - name: Stop temporary CI services
        if: always()
        run: docker compose down

  image:
    name: Publish candidate container
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.publish.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Choose repository image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/agenttrust-docker-config" >> "$GITHUB_ENV"
      - name: Authenticate to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish tested source
        id: publish
        run: |
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$IMAGE_NAME:sha-$GITHUB_SHA" .
          docker push "$IMAGE_NAME:sha-$GITHUB_SHA"
          digest=$(docker image inspect "$IMAGE_NAME:sha-$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          printf '## Candidate container\n\nCommit: `%s`\n\nImmutable image: `%s`\n\nThe digest must pass the separate registry runtime job before main promotion. No server deployment was performed.\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner registry login
        if: always()
        run: docker logout ghcr.io

  image-smoke:
    name: Verify registry image runtime
    outputs:
      manifest: ${{ steps.delivery.outputs.manifest }}
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_PROJECT_NAME: agenttrust-image-${{ github.run_id }}-${{ github.run_attempt }}
      AGENTTRUST_IMAGE: ${{ needs.image.outputs.image }}
      AGENTTRUST_EXPECTED_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Prepare isolated synthetic database and private signing key
        run: |
          npm ci --cache .cache/npm --ignore-scripts
          npm run setup
          echo "AGENTTRUST_API_USER=$(id -u):$(id -g)" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/agenttrust-docker-config" >> "$GITHUB_ENV"
      - name: Authenticate for registry read
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Pull and start exact published digest without building
        run: |
          docker compose -f compose.yaml -f compose.image.yaml pull api worker
          docker compose -f compose.yaml -f compose.image.yaml up -d --no-build --wait api worker
          npm run smoke:image
      - name: Verify evaluation, restart, signed gates and accounting from registry image
        run: |
          node --env-file-if-exists=.env scripts/smoke.mjs before
          docker compose -f compose.yaml -f compose.image.yaml restart api worker
          docker compose -f compose.yaml -f compose.image.yaml up -d --no-build --wait api worker
          node --env-file-if-exists=.env scripts/smoke.mjs after
          node --env-file-if-exists=.env scripts/ci-smoke.mjs
          node --env-file-if-exists=.env scripts/manual-review-smoke.mjs
          npm run smoke:sustained -- --cycles 2 --interval-ms 1000
      - name: Prepare isolated recovery evidence and verify read-only deployment preflight
        shell: bash
        run: |
          npm run smoke:recovery
          node --env-file-if-exists=.env scripts/deploy-preflight.mjs | tee .local/deployment-preflight.json
      - name: Record public runtime delivery manifest
        id: delivery
        run: node scripts/delivery-manifest.mjs runtime
      - name: Stop isolated image services
        if: always()
        run: docker compose -f compose.yaml -f compose.image.yaml down
      - name: Remove runner registry login
        if: always()
        run: docker logout ghcr.io

  promote:
    name: Promote runtime-verified main image
    needs: [image, image-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      AGENTTRUST_DELIVERY_MANIFEST: ${{ needs.image-smoke.outputs.manifest }}
      AGENTTRUST_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Validate delivery manifest before promotion
        run: node scripts/delivery-manifest.mjs validate
      - name: Prepare private runner registry configuration
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/agenttrust-docker-config" >> "$GITHUB_ENV"
      - name: Authenticate to registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Promote the verified digest
        run: |
          image_name=${AGENTTRUST_IMAGE%@*}
          docker pull "$AGENTTRUST_IMAGE"
          docker tag "$AGENTTRUST_IMAGE" "$image_name:main"
          docker push "$image_name:main"
          printf '## Runtime-verified container\n\nCommit: `%s`\n\nDeployable digest: `%s`\n\nRegistry pull, image identity, isolation, evaluation, restart and signed gate verification passed. No server deployment was performed.\n' "$GITHUB_SHA" "$AGENTTRUST_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Record and independently parse promoted public delivery manifest
        shell: bash
        env:
          AGENTTRUST_DELIVERY_REPOSITORY: ${{ github.repository }}
          AGENTTRUST_DELIVERY_RUN_ID: ${{ github.run_id }}
          AGENTTRUST_DELIVERY_RUN_ATTEMPT: ${{ github.run_attempt }}
          AGENTTRUST_EXPECTED_REVISION: ${{ github.sha }}
        run: |
          mkdir -p .local
          node scripts/delivery-manifest.mjs promoted | tee .local/delivery-manifest.json
          node scripts/verify-delivery.mjs .local/delivery-manifest.json
      - name: Prepare public manifest bundle
        run: node scripts/delivery-bundle.mjs
      - name: Verify exact public bundle before upload
        env:
          AGENTTRUST_DELIVERY_REPOSITORY: ${{ github.repository }}
          AGENTTRUST_DELIVERY_RUN_ID: ${{ github.run_id }}
          AGENTTRUST_DELIVERY_RUN_ATTEMPT: ${{ github.run_attempt }}
          AGENTTRUST_EXPECTED_REVISION: ${{ github.sha }}
        run: node scripts/verify-delivery-bundle.mjs "delivery-artifacts/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Save public delivery manifest and checksum
        id: delivery-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agenttrust-delivery-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            delivery-artifacts/${{ github.run_id }}-${{ github.run_attempt }}/delivery-manifest.json
            delivery-artifacts/${{ github.run_id }}-${{ github.run_attempt }}/delivery-manifest.sha256
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30
      - name: Link downloadable delivery files
        env:
          DELIVERY_ARTIFACT_URL: ${{ steps.delivery-artifact.outputs.artifact-url }}
        run: printf '\n[Download public delivery manifest and checksum](%s) (30-day retention).\n' "$DELIVERY_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runner registry login
        if: always()
        run: docker logout ghcr.io
