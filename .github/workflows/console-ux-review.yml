name: Console UX review
on:
  push:
    branches: [codex/audit-actor-search-20261103, codex/audit-period-search-20261104, codex/audit-period-export-20261104]
  pull_request:
    paths:
      - 'apps/console/**'
      - 'scripts/console-ui-review.cjs'
      - 'scripts/showcase-ui-review.cjs'
      - 'scripts/legacy-catalogue-html-review.mjs'
      - 'scripts/stack-legacy-catalogue*.mjs'
      - 'packages/stack-legacy-link/**'
      - 'packages/receipts/**'
      - 'packages/contracts/**'
      - 'packages/evaluator/**'
      - '.github/workflows/console-ux-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: console-ux-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - name: Install pinned console dependencies and isolated browser
        working-directory: apps/console
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - name: Check types and component contracts
        run: |
          npm --prefix apps/console run typecheck
          npm --prefix apps/console test
      - name: Render actual components and review responsive layout without API or credentials
        run: |
          node scripts/console-ui-review.cjs
          node scripts/showcase-ui-review.cjs
      - name: Review synthetic verified legacy catalogue HTML without API access
        run: |
          npm ci --cache .cache/npm --ignore-scripts
          node scripts/legacy-catalogue-html-review.mjs
      - name: Preserve component review screens and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-ux-review-${{ github.sha }}
          path: |
            .local/console-ux-review/*.png
            .local/console-ux-review/summary.json
            .local/showcase-ux-review/*.png
            .local/showcase-ux-review/summary.json
            .local/legacy-catalogue-html-review-*/*.png
            .local/legacy-catalogue-html-review-*/summary.json
          if-no-files-found: error
          # Multiple output roots share .local; include only the explicit
          # synthetic screenshot/summary patterns above, never input files.
          include-hidden-files: true
          retention-days: 7
