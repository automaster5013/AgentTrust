  security-images:
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: original-stack-delivery-${{ github.sha }}
          path: stack-delivery
      - name: Build pinned security tools
        run: |
          python3 scripts/stack-execution-profiles.py --check
          python3 scripts/stack-quality-profiles.py --check
          docker build -t agenttrust-security:local tools/security
      - name: Load exact immutable runtime references
        shell: bash
        run: |
          test "$(cat stack-delivery/revision.txt)" = "$GITHUB_SHA"
          echo "STACK_CORE_IMAGE=$(cat stack-delivery/core-api.txt)" >> "$GITHUB_ENV"
          echo "STACK_WORKER_IMAGE=$(cat stack-delivery/ai-worker.txt)" >> "$GITHUB_ENV"
          echo "STACK_CONSOLE_IMAGE=$(cat stack-delivery/console.txt)" >> "$GITHUB_ENV"
          echo "STACK_HTTPS_CONSOLE_IMAGE=$(cat stack-delivery/console-https.txt)" >> "$GITHUB_ENV"
          echo "STACK_OPA_IMAGE=$(cat stack-delivery/opa.txt)" >> "$GITHUB_ENV"
          echo "STACK_IDENTITY_IMAGE=$(cat stack-delivery/identity.txt)" >> "$GITHUB_ENV"
          echo "STACK_GATEWAY_IMAGE=$(cat stack-delivery/gateway.txt)" >> "$GITHUB_ENV"
          echo "STACK_OBJECT_IMAGE=$(cat stack-delivery/object-store.txt)" >> "$GITHUB_ENV"
          echo "STACK_MODEL_IMAGE=$(cat stack-delivery/local-model.txt)" >> "$GITHUB_ENV"
          echo "STACK_MESSAGING_IMAGE=$(cat stack-delivery/messaging.txt)" >> "$GITHUB_ENV"
          echo "STACK_DATABASE_IMAGE=$(cat stack-delivery/database.txt)" >> "$GITHUB_ENV"
          echo "STACK_TELEMETRY_IMAGE=$(cat stack-delivery/telemetry.txt)" >> "$GITHUB_ENV"
          echo "STACK_TEMPO_IMAGE=$(cat stack-delivery/tempo.txt)" >> "$GITHUB_ENV"
          echo "STACK_LOKI_IMAGE=$(cat stack-delivery/loki.txt)" >> "$GITHUB_ENV"
          echo "STACK_PROMETHEUS_IMAGE=$(cat stack-delivery/prometheus.txt)" >> "$GITHUB_ENV"
          echo "STACK_QUALITY_VERIFIER_IMAGE=$(cat stack-delivery/quality-verifier.txt)" >> "$GITHUB_ENV"
          for name in core-api ai-worker console console-https opa identity gateway object-store database local-model messaging telemetry tempo loki prometheus quality-verifier; do docker pull "$(cat "stack-delivery/$name.txt")"; done
      - name: Generate CycloneDX SBOMs and refuse every HIGH or CRITICAL finding
        run: python3 scripts/stack-security-images.py
      - name: Prepare ephemeral signer registry credentials
        env:
          STACK_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/stack-signing-setup.py
      - name: Keyless sign and verify exact digests and SBOM attestations
        run: python3 scripts/stack-security-sign.py
      - name: Independently verify the consumer delivery bundle
        run: |
          CHECKSUMS_SHA256=$(sha256sum stack-security-delivery/checksums.json | cut -d ' ' -f 1)
          python3 scripts/stack-delivery-verify.py --bundle stack-security-delivery --expected-revision "$GITHUB_SHA" --expected-checksums-sha256 "$CHECKSUMS_SHA256" --repository "$GITHUB_REPOSITORY" --docker-tools
      - name: Verify offline signatures and refuse a tampered HTTPS certificate
        run: python3 scripts/stack-delivery-offline-smoke.py --execute
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-stack-security-delivery-${{ github.sha }}
          path: stack-security-delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve image security failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-stack-image-security-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/stack-security-images-*/summary.json
            .local/stack-delivery-offline-*/summary.json
            .local/stack-security-images-*/reports/*.cdx.json
            .local/stack-security-images-*/reports/*.trivy.json
            .local/stack-security-images-*/reports/*.trivy.log
            .local/stack-security-images-*/reports/*.syft.log
          if-no-files-found: error
          retention-days: 7
      - name: Remove only ephemeral signer credential
        if: always()
        run: python3 -c "from pathlib import Path; p=Path('.local/stack-signing-credentials/config.json'); p.unlink(missing_ok=True)"
  dockerhub:
    name: Publish verified stack to Docker Hub
    needs: security-images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: AgentTrust-dockerhub
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: original-stack-security-delivery-${{ github.sha }}
          path: stack-security-delivery
      - name: Build existing pinned verification tools
        run: docker build -t agenttrust-security:local tools/security
      - name: Authenticate ephemeral registry clients
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.AUTOMASTER5013_AGENTTRUST }}
          HUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        shell: bash
        run: |
          test -n "$HUB_USERNAME" && test -n "$HUB_TOKEN" && test -n "$HUB_NAMESPACE"
          export DOCKER_CONFIG="$RUNNER_TEMP/dockerhub-config"
          mkdir -m 700 "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$HUB_TOKEN" | docker login docker.io --username "$HUB_USERNAME" --password-stdin
      - name: Verify source signatures and mirror all sixteen exact images
        env:
          HUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        shell: bash
        run: |
          CHECKSUMS_SHA256=$(sha256sum stack-security-delivery/checksums.json | cut -d ' ' -f 1)
          python3 scripts/stack-dockerhub.py --bundle stack-security-delivery --expected-revision "$GITHUB_SHA" --expected-checksums-sha256 "$CHECKSUMS_SHA256" --repository "$GITHUB_REPOSITORY" --namespace "$HUB_NAMESPACE" --publish --output stack-security-delivery/dockerhub-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-stack-dockerhub-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: stack-security-delivery/dockerhub-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove ephemeral registry login files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/dockerhub-config/config.json"
