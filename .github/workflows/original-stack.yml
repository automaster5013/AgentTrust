name: Original stack integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: original-stack-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  security-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build pinned source security tools
        run: |
          python3 scripts/stack-execution-profiles.py --check
          python3 scripts/stack-delivery-verifier-test.py
          docker build -t agenttrust-security:local tools/security
      - name: Verify rules and scan tracked source and full Git history
        run: python3 scripts/stack-security-source.py
      - name: Preserve redacted security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-stack-source-security-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/stack-security-source-*/summary.json
            .local/stack-security-source-*/reports/semgrep.json
            .local/stack-security-source-*/reports/gitleaks.json
          if-no-files-found: error
          retention-days: 7
  integration:
    needs: security-source
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare separate PostgreSQL and synthetic identities
        run: |
          python3 scripts/stack-policy-metadata.py --check
          python3 scripts/stack-setup.py
          python3 scripts/stack-identity-setup.py
          python3 scripts/stack-gateway-setup.py
          python3 scripts/stack-object-setup.py
          python3 scripts/stack-observability-setup.py
          docker build --target gate-keys -t agenttrust-gate-key-tool:local services/core-api
          python3 scripts/stack-gate-signing-setup.py
      - name: Build Java 21, Python and TypeScript with their tests
        run: docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml build stack-core-api stack-ai-worker stack-console stack-opa stack-identity stack-gateway stack-object-store stack-db stack-nats
      - name: Verify real authenticated evaluation and review flow
        run: |
          docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml up -d --no-build --wait stack-core-api stack-ai-worker stack-console stack-otel stack-tempo stack-loki stack-prometheus stack-grafana
          python3 scripts/stack-identity-profile.py
          python3 scripts/stack-identity-smoke.py
          python3 scripts/stack-http-smoke.py
          python3 scripts/stack-http-smoke.py --base http://127.0.0.1:4320
          python3 scripts/stack-database-smoke.py
          python3 scripts/stack-database-init-smoke.py
      - name: Verify durable evaluation recovery and execution deadline
        run: |
          python3 scripts/stack-recovery-smoke.py --mode worker-restart
          python3 scripts/stack-recovery-smoke.py --mode nats-restart
          python3 scripts/stack-recovery-smoke.py --mode jetstream-persistence
          python3 scripts/stack-recovery-smoke.py --mode core-restart
          python3 scripts/stack-recovery-smoke.py --mode deadline
          python3 scripts/stack-policy-smoke.py
      - name: Verify immutable versions and authenticated campaign aggregation
        run: |
          python3 scripts/stack-campaign-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-execution-profile-smoke.py
          python3 scripts/stack-campaign-recovery.py
          python3 scripts/stack-campaign-recovery.py --deadline
      - name: Verify frozen campaign evidence and offline byte chains
        run: |
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-campaign-evidence-test.py
          python3 scripts/stack-campaign-archive-smoke.py
      - name: Verify scoped pgvector neighbors and database recovery
        run: python3 scripts/stack-vector-smoke.py
      - name: Verify locked versioned evidence and storage recovery
        run: python3 scripts/stack-object-smoke.py
      - name: Verify evaluator with real Promptfoo
        run: |
          docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.evaluation.yaml build stack-promptfoo
          python3 scripts/stack-promptfoo-smoke.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - name: Verify signed historical campaign observations
        run: |
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-campaign-receipt-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-campaign-observation-matrix.py
      - name: Audit fixed verifier dependency installation
        working-directory: tools/promptfoo
        run: npm audit --omit=optional --audit-level=high
      - name: Verify real browser evaluation and approval controls
        working-directory: apps/console
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Verify persisted results after service restart
        run: |
          docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml restart stack-core-api stack-ai-worker stack-console
          docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml up -d --no-build --wait stack-core-api stack-ai-worker stack-console stack-otel stack-tempo stack-loki stack-prometheus stack-grafana
          python3 scripts/stack-http-smoke.py --base http://127.0.0.1:4320
      - name: Verify actual Redis quotas and recovery
        run: |
          python3 scripts/stack-gateway-smoke.py
      - name: Verify actual pinned local model and immutable provider reservations
        run: |
          docker build -t agenttrust-local-model:local services/local-model
          python3 scripts/stack-provider-setup.py
          python3 scripts/stack-provider-start.py
          python3 scripts/stack-provider-integrity-smoke.py
          python3 scripts/stack-provider-smoke.py
          python3 scripts/stack-campaign-model-smoke.py
          python3 scripts/stack-observability-smoke.py
          python3 scripts/stack-queue-trace-smoke.py
          python3 scripts/stack-observability-outage-smoke.py
          cd apps/console
          STACK_E2E_LOCAL_MODEL=true npx playwright test --grep 'local model provider evidence'
      - name: Preserve safe synthetic fault diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-stack-diagnostics-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/stack-gateway-smoke-*.json
            .local/stack-recovery-*.json
            .local/stack-vector-smoke-*.json
            .local/stack-object-smoke-*.json
            .local/stack-promptfoo-smoke-*.json
            .local/stack-http-smoke-*.json
            .local/stack-campaign-smoke-*.json
            .local/stack-execution-profile-*.json
            .local/stack-campaign-recovery-*.json
            .local/stack-campaign-model-*.json
            .local/stack-campaign-archive-*/summary.json
            .local/stack-campaign-receipt-*/summary.json
            .local/stack-campaign-observation-matrix-*/summary.json
            .local/stack-observability-smoke-*.json
            .local/stack-queue-trace-*.json
            .local/stack-observability-outage-*.json
            .local/stack-database-init-smoke-*.json
            .local/stack-provider-smoke-*.json
            .local/stack-provider-integrity-*/summary.json
            .local/stack-browser-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated runner services
        if: always()
        run: docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml -f compose.stack.providers.yaml down
  images:
    needs: integration
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authenticate to registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/stack-docker-config"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - name: Build, publish and record immutable image references
        shell: bash
        run: |
          mkdir -p stack-delivery
          for spec in 'core-api:services/core-api' 'ai-worker:services/ai-worker' 'console:apps/console' 'opa:services/opa' 'identity:services/identity' 'gateway:services/gateway' 'object-store:services/object-store' 'database:services/database' 'local-model:services/local-model' 'messaging:services/messaging'; do
            service=${spec%%:*}
            context=${spec#*:}
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agenttrust-$service:$GITHUB_SHA"
            docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$image" "$context"
            docker push "$image"
            docker pull "$image"
            docker image inspect "$image" --format '{{index .RepoDigests 0}}' > "stack-delivery/$service.txt"
          done
          printf '%s\n' "$GITHUB_SHA" > stack-delivery/revision.txt
      - name: Prepare isolated registry-image verification
        shell: bash
        run: |
          export STACK_DATABASE_IMAGE="$(cat stack-delivery/database.txt)"
          echo "STACK_DATABASE_IMAGE=$STACK_DATABASE_IMAGE" >> "$GITHUB_ENV"
          python3 scripts/stack-setup.py
          python3 scripts/stack-identity-setup.py
          python3 scripts/stack-gateway-setup.py
          python3 scripts/stack-object-setup.py
          python3 scripts/stack-observability-setup.py
          python3 scripts/stack-gate-signing-setup.py --image "$(cat stack-delivery/core-api.txt)"
          echo "STACK_CORE_IMAGE=$(cat stack-delivery/core-api.txt)" >> "$GITHUB_ENV"
          echo "STACK_WORKER_IMAGE=$(cat stack-delivery/ai-worker.txt)" >> "$GITHUB_ENV"
          echo "STACK_CONSOLE_IMAGE=$(cat stack-delivery/console.txt)" >> "$GITHUB_ENV"
          echo "STACK_OPA_IMAGE=$(cat stack-delivery/opa.txt)" >> "$GITHUB_ENV"
          echo "STACK_IDENTITY_IMAGE=$(cat stack-delivery/identity.txt)" >> "$GITHUB_ENV"
          echo "STACK_GATEWAY_IMAGE=$(cat stack-delivery/gateway.txt)" >> "$GITHUB_ENV"
          echo "STACK_OBJECT_IMAGE=$(cat stack-delivery/object-store.txt)" >> "$GITHUB_ENV"
          echo "STACK_MODEL_IMAGE=$(cat stack-delivery/local-model.txt)" >> "$GITHUB_ENV"
          echo "STACK_MESSAGING_IMAGE=$(cat stack-delivery/messaging.txt)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Execute exact registry images without rebuilding
        run: |
          docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml -f compose.stack.image.yaml up -d --no-build --wait stack-core-api stack-ai-worker stack-console stack-otel stack-tempo stack-loki stack-prometheus stack-grafana
          python3 scripts/stack-identity-profile.py
          python3 scripts/stack-identity-smoke.py
          python3 scripts/stack-http-smoke.py --base http://127.0.0.1:4320
          python3 scripts/stack-database-smoke.py
          python3 scripts/stack-database-init-smoke.py
          python3 scripts/stack-campaign-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-execution-profile-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-campaign-evidence-test.py
          python3 scripts/stack-campaign-archive-smoke.py
          python3 scripts/stack-campaign-receipt-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-campaign-observation-matrix.py
          python3 scripts/stack-object-smoke.py
          python3 scripts/stack-vector-smoke.py
          python3 scripts/stack-gateway-smoke.py
          python3 scripts/stack-provider-setup.py
          python3 scripts/stack-provider-start.py
          python3 scripts/stack-provider-integrity-smoke.py
          python3 scripts/stack-provider-smoke.py
          python3 scripts/stack-campaign-model-smoke.py
          python3 scripts/stack-observability-smoke.py
          python3 scripts/stack-queue-trace-smoke.py
          python3 scripts/stack-observability-outage-smoke.py
          python3 scripts/stack-image-smoke.py
          python3 scripts/stack-delivery-manifest.py
      - name: Preserve safe registry runtime diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-stack-registry-diagnostics-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/stack-gateway-smoke-*.json
            .local/stack-http-smoke-*.json
            .local/stack-campaign-smoke-*.json
            .local/stack-execution-profile-*.json
            .local/stack-campaign-recovery-*.json
            .local/stack-campaign-model-*.json
            .local/stack-campaign-archive-*/summary.json
            .local/stack-campaign-receipt-*/summary.json
            .local/stack-campaign-observation-matrix-*/summary.json
            .local/stack-object-smoke-*.json
            .local/stack-vector-smoke-*.json
            .local/stack-database-init-smoke-*.json
            .local/stack-provider-smoke-*.json
            .local/stack-provider-integrity-*/summary.json
            .local/stack-observability-smoke-*.json
            .local/stack-queue-trace-*.json
            .local/stack-observability-outage-*.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-stack-delivery-${{ github.sha }}
          path: stack-delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Remove registry login
        if: always()
        run: docker logout ghcr.io
      - name: Stop isolated registry-image services
        if: always()
        run: docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml -f compose.stack.image.yaml -f compose.stack.providers.yaml down
  security-images:
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: original-stack-delivery-${{ github.sha }}
          path: stack-delivery
      - name: Build pinned security tools
        run: |
          python3 scripts/stack-execution-profiles.py --check
          docker build -t agenttrust-security:local tools/security
      - name: Load exact immutable runtime references
        shell: bash
        run: |
          test "$(cat stack-delivery/revision.txt)" = "$GITHUB_SHA"
          echo "STACK_CORE_IMAGE=$(cat stack-delivery/core-api.txt)" >> "$GITHUB_ENV"
          echo "STACK_WORKER_IMAGE=$(cat stack-delivery/ai-worker.txt)" >> "$GITHUB_ENV"
          echo "STACK_CONSOLE_IMAGE=$(cat stack-delivery/console.txt)" >> "$GITHUB_ENV"
          echo "STACK_OPA_IMAGE=$(cat stack-delivery/opa.txt)" >> "$GITHUB_ENV"
          echo "STACK_IDENTITY_IMAGE=$(cat stack-delivery/identity.txt)" >> "$GITHUB_ENV"
          echo "STACK_GATEWAY_IMAGE=$(cat stack-delivery/gateway.txt)" >> "$GITHUB_ENV"
          echo "STACK_OBJECT_IMAGE=$(cat stack-delivery/object-store.txt)" >> "$GITHUB_ENV"
          echo "STACK_MODEL_IMAGE=$(cat stack-delivery/local-model.txt)" >> "$GITHUB_ENV"
          echo "STACK_MESSAGING_IMAGE=$(cat stack-delivery/messaging.txt)" >> "$GITHUB_ENV"
          echo "STACK_DATABASE_IMAGE=$(cat stack-delivery/database.txt)" >> "$GITHUB_ENV"
          for name in core-api ai-worker console opa identity gateway object-store database local-model messaging; do docker pull "$(cat "stack-delivery/$name.txt")"; done
      - name: Generate CycloneDX SBOMs and refuse every HIGH or CRITICAL finding
        run: python3 scripts/stack-security-images.py
      - name: Prepare ephemeral signer registry credentials
        env:
          STACK_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/stack-signing-setup.py
      - name: Keyless sign and verify exact digests and SBOM attestations
        run: python3 scripts/stack-security-sign.py
      - name: Independently verify the consumer delivery bundle
        run: |
          CHECKSUMS_SHA256=$(sha256sum stack-security-delivery/checksums.json | cut -d ' ' -f 1)
          python3 scripts/stack-delivery-verify.py --bundle stack-security-delivery --expected-revision "$GITHUB_SHA" --expected-checksums-sha256 "$CHECKSUMS_SHA256" --repository "$GITHUB_REPOSITORY" --docker-tools
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-stack-security-delivery-${{ github.sha }}
          path: stack-security-delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve image security failure diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-stack-image-security-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/stack-security-images-*/summary.json
            .local/stack-security-images-*/reports/*.cdx.json
            .local/stack-security-images-*/reports/*.trivy.json
            .local/stack-security-images-*/reports/*.trivy.log
            .local/stack-security-images-*/reports/*.syft.log
          if-no-files-found: error
          retention-days: 7
      - name: Remove only ephemeral signer credential
        if: always()
        run: python3 -c "from pathlib import Path; p=Path('.local/stack-signing-credentials/config.json'); p.unlink(missing_ok=True)"
