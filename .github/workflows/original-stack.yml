name: Original stack integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  # Hosted runners and SHA-scoped image/artifact names isolate independent revisions.
  group: original-stack-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  security-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build pinned source security tools
        run: |
          python3 -m unittest discover -s scripts -p test_stack_owned_fixture.py
          python3 scripts/stack-execution-profiles.py --check
          python3 scripts/stack-quality-profiles.py --check
          python3 scripts/stack-release-online-test.py
          python3 scripts/stack-local-cd-evidence-test.py
          python3 scripts/stack-local-cd-plan-test.py
          python3 scripts/stack-dockerhub-test.py
          python3 scripts/stack-delivery-verifier-test.py
          python3 scripts/stack-https-release-profile-test.py
          python3 scripts/stack-delivery-offline-test.py
          python3 scripts/stack-scan-scratch-test.py
          python3 scripts/stack-scan-lifecycle-test.py
          python3 scripts/stack-scan-work-test.py
          python3 scripts/stack-browser-quota-guard-test.py
          python3 scripts/stack-gateway-health-probe-test.py
          python3 scripts/stack-workspace-onboarding-test.py
          python3 scripts/stack-workspace-dispatch-load-test.py
          python3 scripts/stack-https-identity-client-test.py
          python3 scripts/stack-https-identity-smoke-test.py
          python3 scripts/stack-https-fixture-diagnostics-test.py
          python3 scripts/stack-https-failure-diagnostic-test.py
          python3 scripts/stack-https-fixture-enterprise-test.py
          node --test scripts/stack-https-fixture-edge-policy-test.mjs
          python3 scripts/stack-coherent-archive-test.py
          python3 scripts/stack-recovery-transport-test.py
          python3 scripts/stack-observation-policy-test.py
          python3 scripts/stack-recovery-load-contract-test.py
          python3 scripts/stack-coherent-orchestration-test.py
          docker build -t agenttrust-security:local tools/security
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --memory 256m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-backup-crypt-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=32m,mode=1777 --memory 256m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-https-fixture-certificates-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --memory 128m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-backup-tar-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --memory 128m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-coherent-probe-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --tmpfs /.local:size=32m,mode=1777 --memory 256m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-backup-custody-test.py
      - name: Verify rules and scan tracked source and full Git history
        run: python3 scripts/stack-security-source.py
      - name: Preserve redacted security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-stack-source-security-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/stack-security-source-*/summary.json
            .local/stack-security-source-*/reports/semgrep.json
            .local/stack-security-source-*/reports/gitleaks.json
          if-no-files-found: error
          retention-days: 7
  integration:
    env:
      COMPOSE_PARALLEL_LIMIT: '2'
    needs: security-source
    runs-on: ubuntu-latest
    # Cold builds, browser regressions and the pinned local model require a full integration budget.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare separate PostgreSQL and synthetic identities
        run: |
          python3 scripts/stack-policy-metadata.py --check
          python3 scripts/stack-setup.py
          python3 scripts/stack-identity-setup.py
          python3 scripts/stack-gateway-setup.py
          python3 scripts/stack-object-setup.py
          python3 scripts/stack-observability-setup.py
          docker build --target gate-keys -t agenttrust-gate-key-tool:local services/core-api
          python3 scripts/stack-gate-signing-setup.py
      - name: Build Java 21, Python and TypeScript with their tests
        run: docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml build stack-core-api stack-ai-worker stack-console stack-opa stack-identity stack-gateway stack-object-store stack-db stack-nats stack-otel stack-tempo stack-loki stack-prometheus stack-quality-verifier
      - name: Verify real authenticated evaluation and review flow
        run: |
          docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml up -d --no-build --wait stack-core-api stack-ai-worker stack-console stack-otel stack-tempo stack-loki stack-prometheus stack-grafana
          python3 scripts/stack-identity-profile.py
          python3 scripts/stack-identity-smoke.py
          python3 scripts/stack-workspace-onboarding-smoke.py --allow-owned-evaluations
          python3 scripts/stack-workspace-dispatch-load.py --allow-owned-evaluations
          python3 scripts/stack-database-process-smoke.py
          python3 scripts/stack-database-process-adversarial.py
          python3 scripts/stack-http-smoke.py
          python3 scripts/stack-http-smoke.py --base http://127.0.0.1:4320
          python3 scripts/stack-database-smoke.py
          python3 scripts/stack-database-init-smoke.py
      - name: Verify isolated HTTPS OIDC proxy configuration
        run: |
          docker build --build-arg NEXT_PUBLIC_STACK_OIDC_PROFILE=https-review --build-arg NEXT_PUBLIC_STACK_APPLICATION_ORIGIN=https://console.example.com --build-arg NEXT_PUBLIC_STACK_PUBLIC_ISSUER=https://identity.example.com/realms/agenttrust --label "org.opencontainers.image.revision=$GITHUB_SHA" -t agenttrust-stack-console:oidc-endpoint-https-candidate apps/console
          docker tag agenttrust-stack-console:oidc-endpoint-https-candidate agenttrust-console-https:local
          python3 scripts/stack-oidc-image-config-test.py
          python3 scripts/stack-oidc-contract-smoke.py
          python3 scripts/stack-oidc-endpoint-proxy-smoke.py
          python3 scripts/stack-console-health-probe-smoke.py
          python3 scripts/stack-oidc-client-contract-smoke.py
          python3 scripts/stack-identity-scope-readiness.py
          python3 scripts/stack-oidc-discovery-smoke.py
          python3 scripts/stack-oidc-client-config-test.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - name: Prepare the disposable runner browser and isolated NSS tools
        working-directory: apps/console
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          sudo apt-get install --no-install-recommends -y libnss3-tools
      - name: Capture controlled before and after console screenshots on disposable runner
        run: python3 scripts/stack-ui-visual-comparison.py --execute
      - name: Publish redacted console before and after images immediately
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: console-visual-before-after-${{ github.sha }}
          retention-days: 7
          path: |
            .local/ui-visual/*.png
            .local/ui-visual/comparison.json
      - name: Capture actual administrator review and mobile detail without writes
        working-directory: apps/console
        run: STACK_E2E_ADMIN_CAPTURE=true STACK_E2E_READ_ONLY=true STACK_E2E_QUOTA_GUARD=true npx playwright test --grep 'administrator actual review form and mobile evidence remain scoped without writes'
      - name: Publish redacted administrator review images immediately
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: console-admin-review-${{ github.sha }}
          path: apps/console/test-results/**/workspace-admin-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Verify actual TLS OIDC login in a fresh portless fixture
        run: |
          docker build -t agenttrust-security:local tools/security
          python3 scripts/stack-https-identity-smoke.py --execute --with-browser --with-enterprise-pilot
      - name: Verify durable evaluation recovery and execution deadline
        run: |
          python3 scripts/stack-recovery-smoke.py --mode worker-restart
          python3 scripts/stack-recovery-smoke.py --mode nats-restart
          python3 scripts/stack-recovery-smoke.py --mode jetstream-persistence
          python3 scripts/stack-recovery-smoke.py --mode core-restart
          python3 scripts/stack-recovery-smoke.py --mode deadline
          python3 scripts/stack-policy-smoke.py
      - name: Verify immutable versions and authenticated campaign aggregation
        run: |
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-campaign-smoke.py
          python3 scripts/stack-campaign-review-history-smoke.py
          python3 scripts/stack-run-review-history-smoke.py
          python3 scripts/stack-evaluation-request-resolution-smoke.py
          python3 scripts/stack-campaign-request-resolution-smoke.py
          python3 scripts/stack-review-precondition-smoke.py --allow-synthetic-writes
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-baseline-gate-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-baseline-unresolved-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-baseline-bundle-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-version-lifecycle-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-audit-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-audit-export-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-audit-search-smoke.py
          python3 scripts/stack-execution-profile-smoke.py
          python3 scripts/stack-campaign-recovery.py
          python3 scripts/stack-campaign-recovery.py --deadline
      - name: Verify frozen campaign evidence and offline byte chains
        run: |
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-campaign-evidence-test.py
          python3 scripts/stack-campaign-archive-smoke.py
      - name: Verify scoped pgvector neighbors and database recovery
        run: python3 scripts/stack-vector-smoke.py
      - name: Verify locked versioned evidence and storage recovery
        run: python3 scripts/stack-object-smoke.py
      - name: Verify evaluator with real Promptfoo
        run: |
          docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.evaluation.yaml build stack-promptfoo
          python3 scripts/stack-promptfoo-smoke.py
      - name: Verify signed historical campaign observations
        run: |
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-campaign-receipt-smoke.py
          node --experimental-strip-types --test scripts/stack-observation-report-test.ts
          python3 scripts/stack-observation-report-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-campaign-observation-matrix.py
      - name: Audit fixed verifier dependency installation
        working-directory: tools/promptfoo
        run: npm audit --omit=optional --audit-level=high
      - name: Verify real browser evaluation and approval controls
        working-directory: apps/console
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          STACK_E2E_QUOTA_GUARD=true npx playwright test
      - name: Preserve workspace browser screenshots before subsequent model tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-workspace-browser-${{ github.sha }}
          path: apps/console/test-results/**/workspace-*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Verify persisted results after service restart
        run: |
          docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml restart stack-core-api stack-ai-worker stack-console
          docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml up -d --no-build --wait stack-core-api stack-ai-worker stack-console stack-otel stack-tempo stack-loki stack-prometheus stack-grafana
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-http-smoke.py --base http://127.0.0.1:4320
      - name: Verify actual Redis quotas and recovery
        run: |
          python3 scripts/stack-gateway-smoke.py
      - name: Verify actual pinned local model and immutable provider reservations
        run: |
          docker build -t agenttrust-local-model:local services/local-model
          python3 scripts/stack-provider-setup.py
          python3 scripts/stack-provider-start.py
          python3 scripts/stack-provider-integrity-smoke.py
          python3 scripts/stack-provider-smoke.py
          python3 scripts/stack-campaign-model-smoke.py
          python3 scripts/stack-quality-campaign-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-review-preflight-smoke.py
          python3 scripts/stack-current-gate-check-smoke.py
          node --experimental-strip-types --test scripts/stack-current-gate-anchor-test.ts
          python3 scripts/stack-verify-audit-export-test.py
          python3 scripts/stack-audit-export-offline-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-current-gate-anchor-smoke.py
          python3 scripts/stack-cancellation-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-run-history-smoke.py
          python3 scripts/stack-campaign-history-smoke.py
          python3 scripts/stack-version-history-smoke.py
          python3 scripts/stack-provider-usage-query-test.py
          python3 scripts/stack-provider-usage-smoke.py
          python3 scripts/stack-evaluation-readiness-smoke.py
          python3 scripts/stack-json-text-smoke.py --stalled-body
          python3 scripts/stack-observability-smoke.py
          python3 scripts/stack-prometheus-smoke.py
          python3 scripts/stack-quality-verifier-smoke.py
          python3 scripts/stack-queue-trace-smoke.py
          python3 scripts/stack-observability-outage-smoke.py
          cd apps/console
          STACK_E2E_QUOTA_GUARD=true STACK_E2E_LOCAL_MODEL=true npx playwright test --grep 'local model provider evidence|reference dataset'
      - name: Restore authenticated database snapshot into an isolated disposable fixture
        run: |
          docker build -t agenttrust-security:local tools/security
          python3 scripts/stack-backup-transport-privacy-test.py
          python3 scripts/stack-database-backup-smoke.py
      - name: Restore encrypted object-store snapshot and verify pinned versions and retention
        run: python3 scripts/stack-object-backup-smoke.py
      - name: Rehearse coherent encrypted business-critical recovery on a portless isolated network
        run: |
          python3 scripts/stack-coherent-retained-recovery.py --execute --exercise-key-rotation --exercise-load
          python3 scripts/stack-public-identity-recovery.py --execute
      - name: Preserve safe synthetic fault diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-stack-diagnostics-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/stack-gateway-smoke-*.json
            .local/stack-recovery-*.json
            .local/stack-vector-smoke-*.json
            .local/stack-object-smoke-*.json
            .local/stack-promptfoo-smoke-*.json
            .local/stack-http-smoke-*.json
            .local/stack-campaign-smoke-*.json
            .local/stack-campaign-review-history-*.json
            .local/stack-run-review-history-*.json
            .local/stack-evaluation-request-resolution-*.json
            .local/stack-campaign-request-resolution-*.json
            .local/stack-review-precondition-*.json
            .local/stack-baseline-gate-*.json
            .local/stack-baseline-unresolved-*.json
            .local/stack-baseline-bundle-*.json
            .local/stack-version-lifecycle-*.json
            .local/stack-audit-smoke-*.json
            .local/stack-audit-export-*.json
            .local/stack-audit-search-*.json
            .local/stack-execution-profile-*.json
            .local/stack-campaign-recovery-*.json
            .local/stack-campaign-model-*.json
            .local/stack-quality-campaign-*/summary.json
            .local/stack-review-preflight-*.json
            .local/stack-current-gate-check-*.json
            .local/stack-current-gate-anchor-*.json
            .local/stack-cancellation-*.json
            .local/stack-run-history-*.json
            .local/stack-campaign-history-*.json
            .local/stack-version-history-*.json
            .local/stack-provider-usage-*.json
            .local/stack-campaign-archive-*/summary.json
            .local/stack-campaign-receipt-*/summary.json
            .local/stack-observation-report-*/summary.json
            .local/stack-observation-report-*/report.html
            .local/stack-campaign-observation-matrix-*/summary.json
            .local/stack-observability-smoke-*.json
            .local/gateway-stage-privacy-*/summary.json
            .local/stack-prometheus-smoke-*.json
            .local/stack-quality-verifier-smoke-*.json
            .local/stack-queue-trace-*.json
            .local/stack-observability-outage-*.json
            .local/stack-database-init-smoke-*.json
            .local/stack-database-process-*.json
            .local/stack-database-process-fixture-*/summary.json
            .local/stack-backup-transport-privacy-*.json
            .local/stack-database-backup-*/summary.json
            .local/stack-object-backup-*/summary.json
            .local/stack-coherent-recovery-*/summary.json
            .local/stack-coherent-retained-custody-*.json
            .local/stack-coherent-snapshot-verification-*.json
            .local/stack-provider-smoke-*.json
            .local/stack-provider-integrity-*/summary.json
            .local/stack-evaluation-readiness-*.json
            .local/stack-json-text-*.json
            .local/stack-oidc-endpoint-proxy-*/summary.json
            .local/stack-https-identity-*/summary.json
            .local/stack-oidc-image-config-*.json
            .local/stack-browser-*.json
            apps/console/test-results/**/workspace-*.png
            .local/ui-visual/*.png
            .local/ui-visual/comparison.json
            .local/stack-workspace-onboarding-*.json
            .local/stack-workspace-dispatch-load-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated runner services
        if: always()
        run: docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml -f compose.stack.providers.yaml down
  images:
    needs: integration
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Registry execution repeats real evaluation, model, backup and recovery checks.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authenticate to registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/stack-docker-config"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
      - name: Build, publish and record immutable image references
        shell: bash
        run: |
          mkdir -p stack-delivery
          for spec in 'core-api:services/core-api' 'ai-worker:services/ai-worker' 'console:apps/console' 'console-https:apps/console' 'opa:services/opa' 'identity:services/identity' 'gateway:services/gateway' 'object-store:services/object-store' 'database:services/database' 'local-model:services/local-model' 'messaging:services/messaging' 'telemetry:services/telemetry' 'tempo:services/tempo' 'loki:services/loki' 'prometheus:services/prometheus' 'quality-verifier:tools/promptfoo'; do
            service=${spec%%:*}
            context=${spec#*:}
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agenttrust-$service:$GITHUB_SHA"
            dockerfile="$context/Dockerfile"
            if [ "$service" = quality-verifier ]; then dockerfile="$context/quality.Dockerfile"; fi
            if [ "$service" = console-https ]; then
              docker build -f "$dockerfile" --build-arg NEXT_PUBLIC_STACK_OIDC_PROFILE=https-review --build-arg NEXT_PUBLIC_STACK_APPLICATION_ORIGIN=https://console.example.com --build-arg NEXT_PUBLIC_STACK_PUBLIC_ISSUER=https://identity.example.com/realms/agenttrust --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$image" "$context"
            else
            docker build -f "$dockerfile" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$image" "$context"
            fi
            docker push "$image"
            docker pull "$image"
            docker image inspect "$image" --format '{{index .RepoDigests 0}}' > "stack-delivery/$service.txt"
          done
          printf '%s\n' "$GITHUB_SHA" > stack-delivery/revision.txt
      - name: Prepare isolated registry-image verification
        shell: bash
        run: |
          export STACK_DATABASE_IMAGE="$(cat stack-delivery/database.txt)"
          echo "STACK_DATABASE_IMAGE=$STACK_DATABASE_IMAGE" >> "$GITHUB_ENV"
          python3 scripts/stack-setup.py
          python3 scripts/stack-identity-setup.py
          python3 scripts/stack-gateway-setup.py
          python3 scripts/stack-object-setup.py
          python3 scripts/stack-observability-setup.py
          python3 scripts/stack-gate-signing-setup.py --image "$(cat stack-delivery/core-api.txt)"
          echo "STACK_CORE_IMAGE=$(cat stack-delivery/core-api.txt)" >> "$GITHUB_ENV"
          echo "STACK_WORKER_IMAGE=$(cat stack-delivery/ai-worker.txt)" >> "$GITHUB_ENV"
          echo "STACK_CONSOLE_IMAGE=$(cat stack-delivery/console.txt)" >> "$GITHUB_ENV"
          echo "STACK_HTTPS_CONSOLE_IMAGE=$(cat stack-delivery/console-https.txt)" >> "$GITHUB_ENV"
          echo "STACK_OPA_IMAGE=$(cat stack-delivery/opa.txt)" >> "$GITHUB_ENV"
          echo "STACK_IDENTITY_IMAGE=$(cat stack-delivery/identity.txt)" >> "$GITHUB_ENV"
          echo "STACK_GATEWAY_IMAGE=$(cat stack-delivery/gateway.txt)" >> "$GITHUB_ENV"
          echo "STACK_OBJECT_IMAGE=$(cat stack-delivery/object-store.txt)" >> "$GITHUB_ENV"
          echo "STACK_MODEL_IMAGE=$(cat stack-delivery/local-model.txt)" >> "$GITHUB_ENV"
          echo "STACK_MESSAGING_IMAGE=$(cat stack-delivery/messaging.txt)" >> "$GITHUB_ENV"
          echo "STACK_TELEMETRY_IMAGE=$(cat stack-delivery/telemetry.txt)" >> "$GITHUB_ENV"
          echo "STACK_TEMPO_IMAGE=$(cat stack-delivery/tempo.txt)" >> "$GITHUB_ENV"
          echo "STACK_LOKI_IMAGE=$(cat stack-delivery/loki.txt)" >> "$GITHUB_ENV"
