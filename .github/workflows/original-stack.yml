name: Original stack integration
on:
  push:
    branches: [main, codex/audit-actor-search-20261103, codex/audit-period-search-20261104, codex/audit-period-export-20261104]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_console_only:
        description: 'Publish one signed Console candidate after full integration; never deploy'
        required: false
        type: boolean
        default: false
concurrency:
  # Hosted runners and SHA-scoped image/artifact names isolate independent revisions.
  group: original-stack-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  windows-custody-fixture:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install isolated test cryptography dependency
        run: python -m pip install --only-binary=:all: cryptography==48.0.0
      - name: Verify synthetic Windows key custody without Docker or real keys
        run: python scripts/stack-backup-custody-test.py -v
  security-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build pinned source security tools
        run: |
          python3 -m unittest discover -s scripts -p test_stack_owned_fixture.py
          python3 -m unittest discover -s scripts -p test_stack_audit_recovery_cohorts.py
          python3 scripts/stack-execution-profiles.py --check
          python3 scripts/stack-quality-profiles.py --check
          python3 scripts/stack-observability-orchestration-test.py
          python3 scripts/stack-tempo-metadata-test.py
          python3 scripts/stack-host-capacity-test.py
          python3 -m unittest discover -s scripts -p test_stack_console_release.py
          python3 -m unittest discover -s scripts -p test_stack_console_runtime_policy.py
          python3 scripts/stack-tempo-repair-plan-test.py
          python3 scripts/stack-tempo-source-recheck-test.py
          python3 scripts/stack-local-cd-executor-test.py
          python3 scripts/stack-store-queue-probe-test.py
          python3 scripts/stack-recovery-evidence-join-test.py
          python3 scripts/stack-isolated-database-rehearsal-test.py
          python3 scripts/stack-isolated-worker-rehearsal-test.py
          python3 scripts/stack-local-cd-reconcile-test.py
          python3 scripts/stack-local-cd-orchestration-test.py
          python3 scripts/stack-release-online-test.py
          python3 scripts/stack-local-cd-evidence-test.py
          python3 scripts/stack-local-cd-plan-test.py
          python3 -m unittest discover -s scripts -p test_stack_v18_transition_probe.py
          python3 -m unittest discover -s scripts -p test_stack_core_return_flow.py
          python3 -m unittest discover -s scripts -p test_stack_ci_worker_pause.py
          python3 -m unittest discover -s scripts -p test_stack_ci_artifacts.py
          python3 -m unittest discover -s scripts -p test_stack_hosted_disk.py
          python3 scripts/stack-dockerhub-main-mirror-test.py
          python3 scripts/stack-dockerhub-test.py
          python3 scripts/stack-delivery-verifier-test.py
          python3 scripts/stack-https-release-profile-test.py
          python3 scripts/stack-delivery-offline-test.py
          python3 scripts/stack-scan-scratch-test.py
          python3 scripts/stack-scan-lifecycle-test.py
          python3 scripts/stack-scan-work-test.py
          python3 scripts/stack-browser-quota-guard-test.py
          python3 scripts/stack-gateway-health-probe-test.py
          python3 scripts/stack-workspace-onboarding-test.py
          python3 scripts/stack-workspace-dispatch-load-test.py
          python3 scripts/stack-https-identity-client-test.py
          python3 scripts/stack-https-identity-smoke-test.py
          python3 scripts/stack-https-fixture-diagnostics-test.py
          python3 scripts/stack-https-failure-diagnostic-test.py
          python3 scripts/stack-https-fixture-enterprise-test.py
          node --test scripts/stack-https-fixture-edge-policy-test.mjs
          python3 scripts/stack-coherent-archive-test.py
          python3 scripts/stack-recovery-transport-test.py
          python3 scripts/stack-observation-policy-test.py
          python3 scripts/stack-recovery-load-contract-test.py
          python3 scripts/stack-coherent-orchestration-test.py
          docker build -t agenttrust-security:local tools/security
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --tmpfs /.local:size=32m,mode=1777 --memory 256m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-online-recovery-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --tmpfs /.local:size=32m,mode=1777 --memory 256m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-live-state-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --tmpfs /.local:size=32m,mode=1777 --memory 256m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-session-recovery-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --tmpfs /.local:size=32m,mode=1777 --memory 256m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-grafana-history-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --tmpfs /.local:size=32m,mode=1777 --memory 256m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-consistency-window-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --tmpfs /.local:size=32m,mode=1777 --memory 256m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-extra-history-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --tmpfs /.local:size=32m,mode=1777 --memory 256m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-chunked-cache-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --memory 256m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-backup-crypt-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=32m,mode=1777 --memory 256m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-https-fixture-certificates-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --memory 128m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-backup-tar-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --memory 128m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-coherent-probe-test.py
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --tmpfs /.local:size=32m,mode=1777 --memory 256m --pids-limit 32 --mount "type=bind,source=$PWD/scripts,target=/scripts,readonly" agenttrust-security:local python /scripts/stack-backup-custody-test.py
      - name: Verify rules and scan tracked source and full Git history
        run: python3 scripts/stack-security-source.py
      - name: Preserve redacted security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-stack-source-security-attempt-${{ github.run_attempt }}-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/stack-security-source-*/summary.json
            .local/stack-security-source-*/reports/semgrep.json
            .local/stack-security-source-*/reports/gitleaks.json
          if-no-files-found: error
          retention-days: 7
  integration:
    # Scoped release rehearsal on a disposable runner with the retained operating schema.
    env:
      COMPOSE_PARALLEL_LIMIT: '2'
      AGENTTRUST_AUDIT_V17_FIXTURE: '1'
    needs: security-source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Admit disposable hosted disk before integration builds
        run: python3 scripts/stack_hosted_disk.py
      - name: Prepare separate PostgreSQL and synthetic identities
        run: |
          python3 scripts/stack-policy-metadata.py --check
          python3 scripts/stack-setup.py
          python3 scripts/stack-identity-setup.py
          python3 scripts/stack-gateway-setup.py
          python3 scripts/stack-object-setup.py
          python3 scripts/stack-observability-setup.py
          docker build --target gate-keys -t agenttrust-gate-key-tool:local services/core-api
          python3 scripts/stack-gate-signing-setup.py
      - name: Build and start the candidate with synthetic evaluation only
        run: |
          cat > .local/audit-synthetic.yaml <<'YAML'
          services:
            stack-ai-worker:
              depends_on: !override
                stack-nats:
                  condition: service_healthy
          YAML
          docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml -f .local/audit-synthetic.yaml build stack-core-api stack-ai-worker stack-console stack-opa stack-identity stack-gateway stack-object-store stack-db stack-nats stack-otel stack-tempo stack-loki stack-prometheus
          docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml -f .local/audit-synthetic.yaml up -d --no-build --wait stack-core-api stack-ai-worker stack-console stack-otel stack-tempo stack-loki stack-prometheus stack-grafana
          python3 scripts/stack-identity-profile.py
          python3 scripts/stack-identity-smoke.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - name: Prepare the disposable runner browser and isolated NSS tools
        working-directory: apps/console
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          sudo apt-get install --no-install-recommends -y libnss3-tools
      - name: Compare scoped audit APIs against PostgreSQL and exercise the browser
        run: |
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-version-lifecycle-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-audit-smoke.py
          python3 scripts/stack-audit-export-smoke.py
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-audit-search-smoke.py
          python3 scripts/stack-audit-period-search-smoke.py --execute
          python3 scripts/stack-test-quota-window.py
          python3 scripts/stack-audit-period-export-smoke.py --execute
          cd apps/console
          STACK_E2E_QUOTA_GUARD=true npx playwright test --grep 'viewer searches actual scoped audit actions'
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-integration-${{ github.sha }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: .local/stack-audit-*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stop the disposable fixture
        if: always()
        run: |
          if [ -f .local/audit-synthetic.yaml ]; then docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml -f .local/audit-synthetic.yaml down; fi

  audit-candidate-delivery:
    needs: integration
    if: github.event_name == 'workflow_dispatch' && github.repository == 'automaster5013/AgentTrust' && github.ref == 'refs/heads/codex/audit-release-integration-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker build -t agenttrust-security:local tools/security
      - name: Prepare temporary registry credentials
        env:
          STACK_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/stack-signing-setup.py
          export DOCKER_CONFIG="$RUNNER_TEMP/audit-registry"
          mkdir -m 700 "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$STACK_REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Scan and sign the three audit candidate images
        run: python3 scripts/stack-audit-candidate-delivery.py publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-delivery-${{ github.sha }}-${{ github.run_attempt }}
          path: audit-delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve image scan diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-image-scans-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .local/stack-security-images-*/summary.json
            .local/stack-security-images-*/reports/*.trivy.json
          if-no-files-found: warn
          retention-days: 7
      - name: Clear temporary registry credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/audit-registry/config.json" .local/stack-signing-credentials/config.json
  audit-candidate-verification:
    needs: audit-candidate-delivery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: audit-delivery-${{ github.sha }}-${{ github.run_attempt }}
          path: audit-delivery
      - run: docker build -t agenttrust-security:local tools/security
      - name: Verify signed digests and the CycloneDX predicates without registry write credentials
        run: python3 scripts/stack-audit-candidate-delivery.py verify

  audit-candidate-recovery:
    needs: audit-candidate-verification
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      COMPOSE_PARALLEL_LIMIT: '2'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: audit-delivery-${{ github.sha }}-${{ github.run_attempt }}
          path: audit-delivery
      - name: Admit disposable hosted disk before integration builds
        run: python3 scripts/stack_hosted_disk.py
      - name: Require a clean fixture before setup
        run: test -z "$(docker ps -aq --filter label=com.docker.compose.project=agenttrust)"
      - name: Prepare separate PostgreSQL and synthetic identities
        run: |
          python3 scripts/stack-policy-metadata.py --check
          python3 scripts/stack-setup.py
          python3 scripts/stack-identity-setup.py
          python3 scripts/stack-gateway-setup.py
          python3 scripts/stack-object-setup.py
          python3 scripts/stack-observability-setup.py
          docker build --target gate-keys -t agenttrust-gate-key-tool:local services/core-api
          python3 scripts/stack-gate-signing-setup.py
      - name: Build only disposable support images
        run: |
          cat > .local/audit-synthetic.yaml <<'YAML'
          services:
            stack-ai-worker:
              depends_on: !override
                stack-nats:
                  condition: service_healthy
          YAML
          docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml -f .local/audit-synthetic.yaml build stack-ai-worker stack-opa stack-identity stack-object-store stack-db stack-nats
      - name: Authenticate the read-only pull client and rehearse rollback
        env:
          STACK_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/audit-recovery-registry"
          mkdir -m 700 "$DOCKER_CONFIG"
          printf '%s' "$STACK_REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 scripts/stack-audit-candidate-recovery.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audit-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: .local/audit-recovery-result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Clean up the owned fixture and pull credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/audit-recovery-registry/config.json"
          if [ -f .local/audit-synthetic.yaml ]; then docker compose --env-file .local/stack/stack.env --env-file .local/stack/identity.env -f compose.stack.yaml -f compose.stack.identity.yaml -f compose.stack.gateway.yaml -f compose.stack.object.yaml -f compose.stack.observability.yaml -f compose.stack.signing.yaml -f .local/audit-synthetic.yaml down; fi

  console-scan-preflight:
    needs: security-source
    if: github.event_name == 'workflow_dispatch' && inputs.publish_console_only == true && github.repository == 'automaster5013/AgentTrust' && github.ref == 'refs/heads/codex/commercial-workspace-ux-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build pinned scanner tools without registry or signing credentials
        run: docker build -t agenttrust-security:local tools/security
      - name: Diagnose the exact Console image before the longer integration completes
        env:
          STACK_CONSOLE_RELEASE_APPROVED: 'true'
          STACK_SOURCE_INTEGRATION_PASSED: 'false'
        run: python3 scripts/stack-console-release.py --preflight
      - name: Retain public preflight reports without treating them as a signed delivery
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: console-only-preflight-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/console-release-*/bundle/console.cdx.json
            .local/console-release-*/bundle/console.trivy.json
          if-no-files-found: ignore
          retention-days: 7
  console-release:
    needs: integration
    if: github.event_name == 'workflow_dispatch' && inputs.publish_console_only == true && github.repository == 'automaster5013/AgentTrust' && github.ref == 'refs/heads/codex/commercial-workspace-ux-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build pinned security tools for the separate Console-only delivery
        run: docker build -t agenttrust-security:local tools/security
      - name: Prepare ephemeral registry credentials
        env:
          STACK_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/stack-signing-setup.py
      - name: Authenticate the temporary build client
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/console-release-login"
          mkdir -m 700 "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build execute scan publish and keyless-sign only the Console
        env:
          STACK_CONSOLE_RELEASE_APPROVED: 'true'
          STACK_SOURCE_INTEGRATION_PASSED: ${{ needs.integration.result == 'success' && 'true' || 'false' }}
        run: python3 scripts/stack-console-release.py --publish
      - name: Independently verify the Console delivery bundle
        run: |
          BUNDLE=$(find .local -maxdepth 3 -type f -path '.local/console-release-*/bundle/checksums.json')
          test "$(printf '%s\n' "$BUNDLE" | wc -l)" -eq 1
          PIN=$(sha256sum "$BUNDLE" | cut -d ' ' -f 1)
          python3 scripts/stack-console-release-verify.py --bundle "$(dirname "$BUNDLE")" --expected-revision "$GITHUB_SHA" --expected-checksums-sha256 "$PIN" --docker-tools
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: console-only-signed-delivery-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          include-hidden-files: true
          path: .local/console-release-*/bundle/*
          if-no-files-found: error
          retention-days: 30
      - name: Retain bounded public package scan diagnostics even on release failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: console-only-scan-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/console-release-*/bundle/console.cdx.json
            .local/console-release-*/bundle/console.trivy.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove only this job's temporary credentials
        if: always()
        run: |
          python3 -c "from pathlib import Path; Path('.local/stack-signing-credentials/config.json').unlink(missing_ok=True)"
          rm -f "$RUNNER_TEMP/console-release-login/config.json"
  images:
    needs: integration
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Registry execution repeats real evaluation, model, backup and recovery checks.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authenticate to registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/stack-docker-config"
