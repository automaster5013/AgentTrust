name: Tempo hosted warm inverse
on:
  pull_request:
    paths:
      - '.github/workflows/tempo-warm-rehearsal.yml'
      - 'ci/tempo-warm-case.json'
      - 'scripts/stack-tempo-ci-*.py'
      - 'scripts/stack_tempo_ci*.py'
      - 'scripts/stack_tempo_poll_evidence.py'
      - 'scripts/stack-tempo-history-recovery.py'
  workflow_dispatch:
    inputs:
      deadline_utc:
        description: 'Explicit UTC cleanup deadline; empty uses the timeboxed case'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: tempo-warm-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  synthetic-warm:
    if: github.repository == 'automaster5013/AgentTrust' && github.event.repository.private == false && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify synthetic fixture tests before execution
        run: python3 scripts/stack-tempo-ci-test.py
      - name: Install checksum-pinned existing verifier
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tempo-ci-bin"
          sh tools/security/download-verified.sh https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 "$RUNNER_TEMP/tempo-ci-bin/cosign" 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
          chmod 755 "$RUNNER_TEMP/tempo-ci-bin/cosign"
          echo "$RUNNER_TEMP/tempo-ci-bin" >> "$GITHUB_PATH"
      - name: Run real signed-image synthetic warm inverse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEMPO_CI_DEADLINE_UTC: ${{ inputs.deadline_utc }}
        run: python3 scripts/stack-tempo-ci-rehearsal.py --execute
      - name: Independently recalculate the saved synthetic proof
        run: python3 scripts/stack-tempo-ci-rehearsal.py --verify-output "$RUNNER_TEMP/tempo-ci-output"
      - name: Preserve bounded synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tempo-warm-synthetic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tempo-ci-output/
          if-no-files-found: warn
          retention-days: 7
