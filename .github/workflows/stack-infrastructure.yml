      - name: Verify source security on the disposable Linux runner
        if: runner.os == 'Linux'
        run: |
          docker build -t agenttrust-security:local tools/security
          python scripts/stack-security-source.py
      - name: Preserve bounded synthetic guard and source reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
