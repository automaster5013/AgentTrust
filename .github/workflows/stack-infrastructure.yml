name: Original stack infrastructure validation
on:
  push:
    branches: [main, codex/audit-actor-search-20261103, codex/audit-period-search-20261104, codex/audit-period-export-20261104]
    paths: ['charts/**', 'infra/terraform/**', 'tools/infrastructure/**', 'scripts/stack-infrastructure-*.py', '.github/workflows/stack-infrastructure.yml', '.github/workflows/original-stack.yml']
  pull_request:
    paths: ['charts/**', 'infra/terraform/**', 'tools/infrastructure/**', 'scripts/stack-infrastructure-*.py', '.github/workflows/stack-infrastructure.yml', '.github/workflows/original-stack.yml']
  workflow_dispatch:
    inputs:
      diagnostic_guards_only:
        description: Run synthetic diagnostic privacy guards without infrastructure or artifact access
        type: boolean
        default: false
      diagnostic_kind:
        description: Existing artifact diagnostic scope
        type: choice
        options: [registry-browser, source-tls-pilot]
        default: registry-browser
      diagnostic_run:
        description: Existing Main original-stack run to inspect without rerunning it
        required: false
        type: string
      diagnostic_revision:
        description: Exact source revision of that existing run
        required: false
        type: string
permissions: {contents: read}
concurrency:
  group: stack-infrastructure-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ !inputs.diagnostic_run && !inputs.diagnostic_guards_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Build checksum pinned Helm Terraform and Kubernetes validators
        run: docker build -t agenttrust-infrastructure:local tools/infrastructure
      - name: Strict chart schemas and mocked Terraform plans without cluster credentials
        run: python3 scripts/stack-infrastructure-check.py
      - name: Preserve credential-free validation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: original-stack-infrastructure-${{ github.sha }}
          include-hidden-files: true
          path: |
            .local/stack-infrastructure-*/summary.json
            .local/stack-infrastructure-*/rendered.yaml
            .local/stack-infrastructure-*/kubernetes-schema.log
            .local/stack-infrastructure-*/terraform-validate.log
            .local/stack-infrastructure-*/terraform-mock-plans.log
            .local/stack-infrastructure-*/dependency-contracts.json
            .local/stack-infrastructure-*/dependencies-*-rendered.yaml
            .local/stack-infrastructure-*/dependencies-*-schema.log
            .local/stack-infrastructure-*/command-diagnostic.json
          if-no-files-found: error
          retention-days: 7
  browser-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_run != '' && !inputs.diagnostic_guards_only }}
    permissions: {contents: read, actions: read}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Authenticate existing artifact and print fixed browser classifications
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_RUN_ID: ${{ inputs.diagnostic_run }}
          DIAGNOSTIC_REVISION: ${{ inputs.diagnostic_revision }}
          DIAGNOSTIC_KIND: ${{ inputs.diagnostic_kind }}
        run: |
          if [ "$DIAGNOSTIC_KIND" = source-tls-pilot ]; then
            python3 scripts/stack-https-failure-diagnostic.py
          else
            python3 scripts/stack-infrastructure-browser-diagnostic.py
          fi
  diagnostic-guards:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_guards_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Verify synthetic diagnostic privacy guards
        run: python scripts/stack-https-failure-diagnostic-test.py -v > diagnostic-normal.log 2>&1
      - name: Verify guards remain active under optimized Python
        run: python -O scripts/stack-https-failure-diagnostic-test.py -v > diagnostic-optimized.log 2>&1
      - name: Verify attempt-bound artifact selection without fetching artifacts
        run: python -m unittest discover -s scripts -p test_stack_ci_artifacts.py -v > artifact-normal.log 2>&1
      - name: Verify optimized artifact selection rejects ambiguity
        run: python -O -m unittest discover -s scripts -p test_stack_ci_artifacts.py -v > artifact-optimized.log 2>&1
      - name: Verify browser diagnostic privacy with synthetic frames
        run: python scripts/stack-infrastructure-browser-diagnostic-test.py -v > browser-normal.log 2>&1
      - name: Verify optimized browser diagnostic privacy
        run: python -O scripts/stack-infrastructure-browser-diagnostic-test.py -v > browser-optimized.log 2>&1
      - name: Verify mocked hosted worker ownership and recovery guards
        run: python -m unittest discover -s scripts -p test_stack_ci_worker_pause.py -v > worker-normal.log 2>&1
      - name: Verify optimized mocked worker guards
        run: python -O -m unittest discover -s scripts -p test_stack_ci_worker_pause.py -v > worker-optimized.log 2>&1
      - name: Verify synthetic delivery manifest bindings
        run: python -m unittest discover -s scripts -p test_stack_delivery_manifest.py -v > manifest-normal.log 2>&1
      - name: Verify optimized synthetic delivery manifest bindings
        run: python -O -m unittest discover -s scripts -p test_stack_delivery_manifest.py -v > manifest-optimized.log 2>&1
      - name: Verify synthetic callback status and cleanup
        run: python scripts/stack-campaign-callback-test.py -v > callback-normal.log 2>&1
      - name: Verify optimized synthetic callback status and cleanup
        run: python -O scripts/stack-campaign-callback-test.py -v > callback-optimized.log 2>&1
      - name: Verify mocked database role observations
        run: python -m unittest discover -s scripts -p test_stack_database_role_probe.py -v > database-normal.log 2>&1
      - name: Verify optimized mocked database role observations
        run: python -O -m unittest discover -s scripts -p test_stack_database_role_probe.py -v > database-optimized.log 2>&1
      - name: Verify mocked pending workspace capability
        run: python -m unittest discover -s scripts -p test_stack_pending_workspace_probe.py -v > pending-normal.log 2>&1
      - name: Verify optimized mocked pending workspace capability
        run: python -O -m unittest discover -s scripts -p test_stack_pending_workspace_probe.py -v > pending-optimized.log 2>&1
      - name: Verify mocked V18 transition preservation
        run: python -m unittest discover -s scripts -p test_stack_v18_transition_probe.py -v > transition-normal.log 2>&1
      - name: Verify optimized mocked V18 transition preservation
        run: python -O -m unittest discover -s scripts -p test_stack_v18_transition_probe.py -v > transition-optimized.log 2>&1
      - name: Verify mocked Core return preservation
        run: python -m unittest discover -s scripts -p test_stack_core_return_flow.py -v > return-normal.log 2>&1
      - name: Verify optimized mocked Core return preservation
        run: python -O -m unittest discover -s scripts -p test_stack_core_return_flow.py -v > return-optimized.log 2>&1
      - name: Verify mocked Compose configuration guards
