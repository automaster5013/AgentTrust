services:
  stack-promptfoo:
    profiles: [evaluation]
    build: tools/promptfoo
    image: agenttrust-promptfoo:local
    secrets: [stack-demo-credentials, stack-worker-token]
    networks: [stack-backend]
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
